    difficolta: "Media", tempo: "20 minuti", costo: "3–12 €",
    sicurezza: "Stacca sempre la spina dalla presa prima di toccare qualsiasi parte. Se il cavo è bruciato o spellato, non riusarlo: sostituiscilo o chiedi a un elettricista.",
    attrezzi: ["Lampadina nuova", "Cacciavite piccolo", "Tester per continuità (facoltativo)"],
    passi: [
      { t: "Stacca la spina", d: "Scollega la lampada dalla presa e aspetta che la lampadina si raffreddi." },
      { t: "Cambia la lampadina", d: "Provane una che funziona di sicuro, dello stesso tipo e della stessa potenza." },
      { t: "Prova un'altra presa", d: "Collega la lampada a una presa che sai funzionare, per escludere un problema dell'impianto." },
      { t: "Controlla spina e cavo", d: "Cerca segni di bruciato, tagli o fili scoperti. Se ne trovi, ferma la riparazione e sostituisci il cavo." },
      { t: "Controlla l'interruttore", d: "Se tutto è a posto, l'interruttore è il sospettato: si sostituisce con un ricambio uguale." }
    ] }
];

var form = document.getElementById("form");
var input = document.getElementById("q");
var go = document.getElementById("go");
var statusEl = document.getElementById("status");
var resultEl = document.getElementById("result");

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function tag(p, d) {
  if (p.origine === "web" && p.fonte && d.fonti && d.fonti[p.fonte - 1] && safeUrl(d.fonti[p.fonte - 1].url)) {
    return '<a class="tag web" href="' + esc(safeUrl(d.fonti[p.fonte - 1].url)) + '" target="_blank" rel="noopener">Dal web · fonte ' + p.fonte + '</a>';
  }
  if (p.origine === "ai") return '<span class="tag ai">Conoscenza AI</span>';
  return "";
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

function showStatus(msg, kind) {
  statusEl.hidden = !msg;
  statusEl.className = "status" + (kind === "error" ? " error" : "");
  statusEl.innerHTML = kind === "loading" ? '<span class="spinner"></span><span>' + esc(msg) + "</span>" : esc(msg);
}

function findDemo(q) {
  var t = q.toLowerCase();
  for (var i = 0; i < DEMO.length; i++) {
    for (var j = 0; j < DEMO[i].keys.length; j++) { if (t.indexOf(DEMO[i].keys[j]) !== -1) return DEMO[i]; }
  }
  return null;
}

function render(d, demo) {
  var photo = "";
  if (d.immagine && safeUrl(d.immagine.url)) {
    photo = '<div class="photo"><img src="' + esc(safeUrl(d.immagine.url)) + '" alt="' + esc(d.oggetto) + '"></div>';
    if (d.immagine.autore) {
      var link = safeUrl(d.immagine.link);
      photo += '<p class="credit">Foto: ' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(d.immagine.autore) + "</a>" : esc(d.immagine.autore)) + "</p>";
    }
  } else {
    photo = '<div class="photo" role="img" aria-label="Illustrazione: ' + esc(d.oggetto) + '">' + (ICONS[d.icon] || ICONS.generico) + "</div>";
  }
  var facts = [["Difficoltà", d.difficolta], ["Tempo", d.tempo], ["Costo", d.costo]].filter(function (f) { return f[1]; })
    .map(function (f) { return '<div class="fact"><dt>' + f[0] + "</dt><dd>" + esc(f[1]) + "</dd></div>"; }).join("");
  var warn = d.sicurezza ? '<div class="warn" role="note">' + WARN_ICON + "<div><strong>Sicurezza</strong>" + esc(d.sicurezza) + "</div></div>" : "";
  var tools = (d.attrezzi || []).length ? "<section><h3>Cosa ti serve</h3><ul class=\"tools\">" + d.attrezzi.map(function (a) { return "<li>" + esc(a) + "</li>"; }).join("") + "</ul></section>" : "";
  var steps = (d.passi || []).length ? "<section><h3>Passaggi</h3><ol class=\"steps\">" + d.passi.map(function (p, i) { return "<li><div><b>" + esc(p.t) + "</b><span>" + esc(p.d) + "</span>" + stepExtra(p) + tag(p, d) + '<button type="button" class="ask" data-step="' + i + '">Chiedi su questo passaggio</button></div></li>'; }).join("") + "</ol></section>" : "";
  var src = (d.fonti || []).filter(function (s) { return safeUrl(s.url); });
  var sources = src.length ? "<section><h3>Fonti dal web</h3><ol class=\"sources\">" + src.map(function (s) { return '<li><a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a></li>"; }).join("") + "</ol></section>" : "";
  var note = demo ? '<p class="footnote">Questa è una scheda di esempio, scritta a mano. Con il server collegato la scheda viene costruita ogni volta da una ricerca sul web, con la foto vera dell\'oggetto.</p>' : '<p class="footnote">Le istruzioni uniscono quello che dicono le pagine web e la conoscenza dell’AI. I passaggi con l’etichetta AI non si appoggiano a una pagina precisa: verificali con attenzione. Se un passaggio non ti convince, fermati e chiedi a un professionista.</p>';

  resultEl.innerHTML = '<div class="sheet">' + photo + '<div class="body"><div class="title-row"><h2>' + esc(d.oggetto) + "</h2>" + (demo ? '<span class="demo-badge">Esempio</span>' : "") + "</div>" +
    (d.riassunto ? '<p class="summary">' + esc(d.riassunto) + "</p>" : "") +
    (facts ? '<dl class="facts">' + facts + "</dl>" : "") + warn + tools + steps + CHAT_HTML + sources + note + "</div></div>";
  resultEl.hidden = false;
  current = d;
  chat = [];
  renderMsgs();
}

/* ---------- Chat: domande su come procede la riparazione ---------- */
var API_CHAT = "/api/chiedi";
var chat = [];
var current = null;
var chatBusy = false;
var SUGG = ["Non ho questo attrezzo, cosa posso usare?", "Mi si è bloccato un pezzo, cosa faccio?", "Come capisco se ho fatto bene?", "Posso farlo da solo o serve un professionista?"];
var CHAT_HTML = '<section class="chat"><h3>Hai un dubbio? Chiedimelo</h3><p class="chat-hint">Dimmi a che punto sei o cosa vedi, e rispondo sul tuo caso.</p><div class="msgs" id="msgs" aria-live="polite" hidden></div><div class="sugg">' +
  SUGG.map(function (s) { return '<button type="button" class="chip sq">' + esc(s) + "</button>"; }).join("") +
  '</div><form id="chatform" autocomplete="off"><input id="cq" type="text" maxlength="400" placeholder="Per esempio: la vite non si svita" aria-label="La tua domanda"><button id="cgo" class="go" type="submit">Invia</button></form></section>';

function stepExtra(p) {
  var h = "";
  if (p.controllo) h += '<p class="ex"><strong>Controlla:</strong> ' + esc(p.controllo) + "</p>";
  if (p.attenzione) h += '<p class="ex att"><strong>Attenzione:</strong> ' + esc(p.attenzione) + "</p>";
  return h;
}

function renderMsgs() {
  var el = document.getElementById("msgs");
  if (!el) return;
  el.hidden = !chat.length;
  el.innerHTML = chat.map(function (m) {
    if (m.loading) return '<div class="msg ai"><span class="spinner"></span></div>';
    var src = (m.fonti || []).filter(function (s) { return safeUrl(s.url); }).map(function (s) {
      return '<a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a>";
    }).join("");
    return '<div class="msg ' + (m.role === "user" ? "me" : "ai") + (m.error ? " err" : "") + '">' + esc(m.content).replace(/\n/g, "<br>") + (src ? '<div class="msrc">' + src + "</div>" : "") + "</div>";
  }).join("");
  el.scrollTop = el.scrollHeight;
}

function ask(text) {
  text = (text || "").trim();
  if (!text || chatBusy || !current) return;
  chatBusy = true;
  var thread = chat;
  var loading = { loading: true };
  thread.push({ role: "user", content: text });
  thread.push(loading);
  renderMsgs();
  var btn = document.getElementById("cgo");
  if (btn) btn.disabled = true;

  var history = thread.filter(function (m) { return !m.loading && !m.error; }).map(function (m) { return { role: m.role, content: m.content }; }).slice(-10);
  var payload = { oggetto: current.oggetto, passi: (current.passi || []).map(function (p) { return { t: p.t, d: p.d }; }), messaggi: history };
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, 60000) : null;

  fetch(API_CHAT, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
    .then(function (r) {
      var type = r.headers.get("content-type") || "";
      if (!r.ok && type.indexOf("json") === -1) throw new Error("server non disponibile");
      if (type.indexOf("json") === -1) throw new Error("server non disponibile");
      return r.json();
    })
    .then(function (data) {
      thread.splice(thread.indexOf(loading), 1);
      if (data.errore || !data.risposta) thread.push({ role: "assistant", content: data.errore || "Non ho ricevuto una risposta. Riprova.", error: true });
      else thread.push({ role: "assistant", content: data.risposta, fonti: data.fonti });
    })
    .catch(function () {
      thread.splice(thread.indexOf(loading), 1);
      thread.push({ role: "assistant", content: "Il server non è ancora collegato, quindi qui non posso rispondere. Dopo la pubblicazione su Vercel potrai fare domande su ogni passaggio.", error: true });
    })
    .then(function () {
      if (timer) clearTimeout(timer);
      chatBusy = false;
      if (thread === chat) { var b = document.getElementById("cgo"); if (b) b.disabled = false; renderMsgs(); }
    });
}

function search(q) {
  q = q.trim();
  if (!q) return;
  go.disabled = true;
  resultEl.hidden = true;
  showStatus("Cerco come si ripara…", "loading");

  var done = function () { go.disabled = false; };
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, 60000) : null;

  fetch(API_URL + "?q=" + encodeURIComponent(q), ctl ? { signal: ctl.signal } : {})
    .then(function (r) {
      var type = r.headers.get("content-type") || "";
      if (!r.ok || type.indexOf("json") === -1) throw new Error("server non disponibile");
      return r.json();
    })
    .then(function (data) {
      if (timer) clearTimeout(timer);
      if (data.errore) { showStatus(data.errore, "error"); return; }
      showStatus("");
      render(data, false);
    })
    .catch(function () {
      if (timer) clearTimeout(timer);
      var demo = findDemo(q);
      if (demo) { showStatus(""); render(demo, true); }
      else { showStatus("Il server non è ancora collegato, quindi posso mostrarti solo gli esempi: rubinetto, cerniera lampo, catena della bici, lampada."); }
    })
    .then(done);
}

form.addEventListener("submit", function (e) { e.preventDefault(); search(input.value); });
document.getElementById("chips").addEventListener("click", function (e) {
  var b = e.target.closest(".chip");
  if (!b) return;
  input.value = b.getAttribute("data-q");
  search(input.value);
});

resultEl.addEventListener("submit", function (e) {
  if (e.target.id !== "chatform") return;
  e.preventDefault();
  var field = document.getElementById("cq");
  var t = field.value;
  field.value = "";
  ask(t);
});
resultEl.addEventListener("click", function (e) {
  var sq = e.target.closest(".sq");
  if (sq) { ask(sq.textContent); return; }
  var a = e.target.closest(".ask");
  if (a && current) {
    var n = parseInt(a.getAttribute("data-step"), 10);
    var p = current.passi[n];
    var field = document.getElementById("cq");
    if (!p || !field) return;
    field.value = "Sul passaggio " + (n + 1) + " (" + p.t + "): ";
    field.focus();
    field.scrollIntoView({ block: "center" });
  }
});

/* Apre già con una scheda di esempio, così si vede subito cosa fa il sito. */
input.value = "rubinetto che gocciola";
render(DEMO[0], true);
</script>

</html>
